en:
  blacklight:
    application_name: "EarthWorks"
    back_to_search: "Back to search results"
    # Accessible names for the badge and thumbnail icons. Blacklight::Icons::*
    # components look these up as blacklight.icon.<name>; GeoBlacklight shipped
    # them until 6.0.0-alpha.7 and dropped the whole tree in 6.0.0-beta.1, so we
    # supply the ones our records actually use.
    icon:
      public: Public content
      restricted: Restricted content
      # These four have never been defined for EarthWorks' resource classes and
      # types, so they rendered as "translation missing" before this upgrade too.
      datasets: Datasets
      maps: Maps
      line: Line data
      polygon: Polygon data
    search:
      facets:
        group:
          close: Hide facets
          open: Limit your search
      filters:
        title: "Your selections: "
      form:
        search:
          label: "search for"
          placeholder: 'Try "groundwater"'
      show:
        title: "%{document_title} in %{application_name}"
        label: "%{label}"
      start_over: "Clear all"
      fields:
        search: "Keywords"
      bookmarks:
        present: "Bookmarked"
        absent: "Bookmark"
        inprogress: "Saving..."
      per_page:
        label: '%{count}<span class="sr-only visually-hidden"> per page</span>'
        button_label_html: '%{count}<span class="d-sm-inline"> per page</span>'
        title: "Number of results to display per page"
        submit: "Update"
        aria_label: "Results navigation"
      sort:
        label_html: 'Sort<span class="d-sm-inline"> by %{field}</span>'
        submit: "sort results"
    tools:
      citation: Cite
      title: "Other options"
