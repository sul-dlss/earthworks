# Solid Cache configuration. Cache entries are stored in the primary database
# (no separate cache database is configured), so no `database:` key is set.
# See https://github.com/rails/solid_cache#configuration
default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
